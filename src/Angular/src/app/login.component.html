<div class="login-container">
  <div class="login-card">
    <h2 class="login-title">Sign in to your account</h2>

    <!-- Status Messages -->
    <div *ngIf="errorMessage" class="status-message error">
      <h3>Login Failed</h3>
      <p>{{ errorMessage }}</p>
    </div>

    <div *ngIf="successMessage" class="status-message success">
      <h3>Login Succeeded</h3>
      <p>{{ successMessage }}</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          id="email"
          name="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="Enter your email"
          class="form-input"
        />
        <div *ngIf="getEmailErrorMessage()" class="error-text">
          {{ getEmailErrorMessage() }}
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          class="form-input"
        />
        <div *ngIf="getPasswordErrorMessage()" class="error-text">
          {{ getPasswordErrorMessage() }}
        </div>
      </div>

      <div class="form-options">
        <div class="checkbox-group">
          <input
            id="remember-me"
            name="remember-me"
            type="checkbox"
            formControlName="rememberMe"
          />
          <label for="remember-me">Remember me</label>
        </div>

        <a routerLink="/forgot-password" class="forgot-link">
          Forgot password?
        </a>
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid || loading"
        class="submit-button"
      >
        <span *ngIf="loading" class="loading-spinner">⟳</span>
        {{ loading ? 'Signing in...' : 'Sign in' }}
      </button>

      <div class="signup-link">
        Don't have an account?
        <a routerLink="/register">Sign up</a>
      </div>
    </form>
  </div>
</div>

<style>
.login-container {
  min-height: calc(100vh - 8rem);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

.login-card {
  width: 100%;
  max-width: 400px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  padding: 2.5rem;
  text-align: center;
}

.login-title {
  font-size: 1.8rem;
  font-weight: 600;
  color: #2d3748;
  margin-bottom: 2rem;
  text-align: center;
}

.status-message {
  margin-bottom: 1.5rem;
  padding: 1rem;
  border-radius: 8px;
  text-align: center;
}

.status-message.error {
  background-color: #fed7d7;
  border: 1px solid #feb2b2;
  color: #c53030;
}

.status-message.success {
  background-color: #c6f6d5;
  border: 1px solid #9ae6b4;
  color: #2f855a;
}

.status-message h3 {
  font-size: 1.1rem;
  font-weight: 600;
  margin: 0 0 0.5rem 0;
}

.status-message p {
  font-size: 0.9rem;
  margin: 0;
}

.login-form {
  text-align: left;
}

.form-group {
  margin-bottom: 1.5rem;
}

.form-group label {
  display: block;
  font-weight: 500;
  color: #374151;
  margin-bottom: 0.5rem;
  text-align: left;
}

.form-input {
  width: 100%;
  padding: 0.75rem 1rem;
  border: 2px solid #e2e8f0;
  border-radius: 8px;
  font-size: 1rem;
  transition: all 0.3s ease;
  background: white;
  color: #2d3748;
}

.form-input:focus {
  outline: none;
  border-color: #667eea;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.error-text {
  color: #e53e3e;
  font-size: 0.875rem;
  margin-top: 0.5rem;
  text-align: left;
}

.form-options {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2rem;
}

.checkbox-group {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.checkbox-group input[type="checkbox"] {
  width: 16px;
  height: 16px;
}

.checkbox-group label {
  margin: 0;
  font-size: 0.9rem;
  color: #4a5568;
}

.forgot-link {
  color: #667eea;
  text-decoration: none;
  font-size: 0.9rem;
}

.forgot-link:hover {
  text-decoration: underline;
}

.submit-button {
  width: 100%;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  padding: 0.875rem 1.5rem;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}

.submit-button:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

.submit-button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.loading-spinner {
  animation: spin 1s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.signup-link {
  text-align: center;
  margin-top: 1.5rem;
  color: #4a5568;
  font-size: 0.9rem;
}

.signup-link a {
  color: #667eea;
  text-decoration: none;
  font-weight: 500;
}

.signup-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  .login-card {
    padding: 1.5rem;
    margin: 1rem;
  }

  .form-options {
    flex-direction: column;
    gap: 1rem;
    align-items: flex-start;
  }
}
</style>
