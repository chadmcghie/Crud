name: Deploy to Staging

on:
  push:
    branches: [ dev ]
  workflow_dispatch:  # Allow manual trigger

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  # Skip deployment if it's a Copilot commit
  check-commit:
    name: Check Deployment Prerequisites
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}

    steps:
    - name: Check if Copilot commit
      id: check
      run: |
        if [[ "${{ github.event.head_commit.author.email }}" == *"copilot"* ]] ||
           [[ "${{ github.event.head_commit.author.name }}" == *"copilot"* ]]; then
          echo "should-deploy=false" >> $GITHUB_OUTPUT
          echo "⏭️ Skipping deployment - Copilot commit detected"
        else
          echo "should-deploy=true" >> $GITHUB_OUTPUT
          echo "✅ Proceeding with staging deployment"
        fi

  build-staging:
    name: Build for Staging (Once)
    runs-on: ubuntu-latest
    needs: check-commit
    if: needs.check-commit.outputs.should-deploy == 'true'
    outputs:
      artifacts-created: ${{ steps.create-artifacts.outputs.created }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: 'src/**/*.csproj'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'src/Angular/package-lock.json'

    - name: Build backend for staging (Testing config)
      run: |
        echo "🏗️ Building backend for staging with Testing configuration..."
        dotnet restore solutions/Crud.sln
        dotnet build solutions/Crud.sln --no-restore --configuration Release
        echo "✅ Backend build completed for staging environment"

    - name: Install Angular dependencies
      working-directory: ./src/Angular
      run: |
        echo "📦 Installing Angular dependencies for staging build..."
        npm ci
        echo "✅ Angular dependencies installed"

    - name: Build Angular for staging
      working-directory: ./src/Angular
      run: |
        echo "🏗️ Building Angular for staging configuration..."
        npm run build -- --configuration=staging
        echo "✅ Angular built for staging configuration"

    - name: Create staging artifacts
      id: create-artifacts
      run: |
        echo "📦 Creating staging build artifacts..."

        # Create version info for staging environment
        echo "{\"version\":\"${{ github.sha }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"branch\":\"${{ github.ref_name }}\",\"buildNumber\":\"${{ github.run_number }}\",\"environment\":\"staging\"}" > version.json
        echo "📋 Version info for staging:"
        cat version.json

        echo "created=true" >> $GITHUB_OUTPUT
        echo "✅ Staging artifacts prepared"

    - name: Upload staging build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: staging-build-${{ github.sha }}
        path: |
          src/*/bin/Release/
          test/*/bin/Release/
          src/Api/appsettings*.json
          src/Angular/dist/
          version.json
        retention-days: 7

  staging-smoke-tests:
    name: Staging Smoke Tests (Using Build Artifacts)
    runs-on: ubuntu-latest
    needs: [check-commit, build-staging]
    if: needs.check-commit.outputs.should-deploy == 'true' && needs.build-staging.outputs.artifacts-created == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download staging build artifacts
      uses: actions/download-artifact@v4
      with:
        name: staging-build-${{ github.sha }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: 'src/**/*.csproj'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'src/Angular/package-lock.json'

    - name: Verify staging artifacts
      run: |
        echo "📋 Using staging build artifacts (no rebuild)..."
        if [ -f "version.json" ]; then
          echo "Staging artifact version:"
          cat version.json | jq .
        fi
        echo "✅ Staging artifacts verified - ready for smoke tests"
        
    # Install E2E dependencies
    - name: Install E2E dependencies
      working-directory: ./test/Tests.E2E.NG
      run: |
        npm ci
        npx playwright install --with-deps chromium
        
    # Run smoke tests only - targeting 2 minutes as per issue requirements  
    - name: Run staging-specific smoke tests
      working-directory: ./test/Tests.E2E.NG
      run: |
        echo "🚀 Running staging smoke tests using staging build artifacts..."
        echo "Targeting ~2 minutes with Testing configuration"
        npm run test:smoke  # Instead of full suite
      env:
        CI: true
        ASPNETCORE_ENVIRONMENT: Testing
        DatabaseProvider: SQLite
        TEST_RESET_TOKEN: test-only-token
        TEST_RUN_ID: staging-${{ github.run_id }}-${{ github.run_number }}
        
    - name: Upload staging test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: staging-smoke-tests-${{ github.sha }}
        path: |
          test/Tests.E2E.NG/playwright-report/
          test/Tests.E2E.NG/test-results/
        retention-days: 7

  prepare-staging-artifacts:
    name: Prepare Staging Deployment Artifacts (Using Build Artifacts)
    runs-on: ubuntu-latest
    needs: [build-staging, staging-smoke-tests]
    if: needs.staging-smoke-tests.result == 'success' && needs.build-staging.outputs.artifacts-created == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download staging build artifacts
      uses: actions/download-artifact@v4
      with:
        name: staging-build-${{ github.sha }}

    - name: Verify staging artifacts for deployment
      run: |
        echo "📦 Using staging build artifacts for deployment (no rebuild)..."
        if [ -f "version.json" ]; then
          echo "📋 Deployment artifact version:"
          cat version.json | jq .
        fi
        echo "✅ Staging artifacts verified for deployment preparation"

    - name: Verify Angular staging build
      run: |
        echo "📋 Verifying Angular staging build from artifacts..."
        if [ -d "src/Angular/dist" ]; then
          echo "✅ Angular staging build found in artifacts"
          ls -la src/Angular/dist/
        else
          echo "❌ Angular staging build not found in artifacts!"
          exit 1
        fi

    - name: Package backend for staging (using artifacts)
      run: |
        echo "📦 Packaging backend from staging artifacts (no rebuild)..."

        # Package the pre-built backend from artifacts
        mkdir -p ./staging-backend
        cp -r src/Api/bin/Release/net8.0/* ./staging-backend/

        # Copy appsettings files
        if [ -f "src/Api/appsettings.json" ]; then
          cp src/Api/appsettings*.json ./staging-backend/
          echo "✅ Appsettings files copied to staging package"
        fi

        # Create version info for staging environment
        echo "{\"version\":\"${{ github.sha }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"branch\":\"${{ github.ref_name }}\",\"buildNumber\":\"${{ github.run_number }}\",\"environment\":\"staging\"}" > ./staging-backend/version.json
        echo "📋 Version info for staging:"
        cat ./staging-backend/version.json

        cd ./staging-backend
        zip -r ../staging-api.zip .
        cd ..
        echo "✅ Backend packaged for staging deployment"
        
    - name: Package frontend (using artifacts)
      run: |
        echo "📦 Packaging frontend from staging artifacts (no rebuild)..."
        cd ./src/Angular/dist
        zip -r ../../../staging-frontend.zip .
        cd ../../..
        echo "✅ Frontend packaged from staging artifacts"
        
    - name: Upload staging artifacts
      uses: actions/upload-artifact@v4
      with:
        name: staging-artifacts-${{ github.sha }}
        path: |
          staging-api.zip
          staging-frontend.zip
        retention-days: 7

  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: prepare-staging-artifacts
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: staging-artifacts-${{ github.sha }}
        
    # ====================================
