name: Pull Request Validation

# This workflow handles comprehensive testing when PRs are opened or updated
# It runs in addition to feature-branch-tests.yml for thorough validation
on:
  pull_request:
    branches: [ main, dev, staging ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # Changed from read to write for auto-formatting
  checks: write
  pull-requests: write

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  download-feature-artifacts:
    name: Download Feature Artifacts
    runs-on: ubuntu-latest
    outputs:
      artifacts-found: ${{ steps.check-artifacts.outputs.found }}

    steps:
    - name: Download feature build artifacts
      uses: actions/download-artifact@v4
      id: download-artifacts
      with:
        name: feature-build-${{ github.sha }}
      continue-on-error: true

    - name: Check artifacts availability
      id: check-artifacts
      run: |
        if [ -f "version.json" ]; then
          echo "✅ Feature artifacts found and downloaded"
          echo "📋 Artifact version:"
          cat version.json | jq .
          echo "found=true" >> $GITHUB_OUTPUT
        else
          echo "❌ No feature artifacts found - will need to build"
          echo "found=false" >> $GITHUB_OUTPUT
        fi

  build-fallback:
    name: Build Solution (Fallback)
    runs-on: ubuntu-latest
    needs: download-feature-artifacts
    if: needs.download-feature-artifacts.outputs.artifacts-found != 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: 'src/**/*.csproj'

    - name: Restore .NET dependencies
      run: dotnet restore solutions/Crud.sln

    - name: Build solution (fallback)
      run: |
        echo "🔄 Building solution as fallback (no feature artifacts available)"
        dotnet build solutions/Crud.sln --no-restore --configuration Release

    - name: Create fallback artifact
      run: |
        echo "📦 Creating fallback artifact for PR validation"
        echo "{\"version\":\"${{ github.sha }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"branch\":\"${{ github.ref_name }}\",\"buildNumber\":\"${{ github.run_number }}\",\"workflow\":\"pr-validation-fallback\"}" > version.json

    - name: Upload fallback artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pr-build-${{ github.sha }}
        path: |
          src/*/bin/Release/
          test/*/bin/Release/
          src/Api/appsettings*.json
          version.json
        retention-days: 1

  code-quality:
    name: Code Quality & Auto-Format
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: 'src/**/*.csproj'
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'src/Angular/package-lock.json'
        
    - name: Auto-format Backend Code
      run: |
        echo "🔧 Auto-formatting C# code with dotnet format..."
        dotnet format solutions/Crud.sln
        echo "✅ Formatting complete"
        
    - name: Frontend Linting
      working-directory: ./src/Angular
      run: |
        echo "🔍 Running Angular linting..."
        npm ci
        npm run lint
        
    - name: Commit and Push Formatting Changes
      run: |
        echo "🔍 Checking for formatting changes..."
        
        # Configure git
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Add all changes including line ending normalization
        git add -A --renormalize
        
        # Check if there are any staged changes
        if ! git diff --staged --quiet; then
          echo "✨ Formatting changes detected, committing..."
          git commit -m "style: auto-format code with dotnet format [skip ci]
        
        Applied automatic formatting to ensure consistent code style.
        This commit was automatically generated by GitHub Actions."
          
          # Push changes
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          echo "✅ Formatting changes pushed successfully"
          
          # IMPORTANT: Pull the changes back to update our local working copy
          echo "📥 Pulling formatting changes back to working copy..."
          git pull origin ${{ github.event.pull_request.head.ref || github.ref_name }}
        else
          echo "✅ No formatting changes needed - code is already properly formatted"
        fi
        
    - name: Verify Final Formatting
      run: |
        echo "🔍 Verifying that all code is now properly formatted..."
        dotnet format solutions/Crud.sln --verify-no-changes --verbosity diagnostic
        if [ $? -ne 0 ]; then
          echo "❌ ERROR: Code still has formatting issues after auto-format!"
          echo "This should not happen. Please check the workflow configuration."
          exit 1
        fi
        echo "✅ All code is properly formatted and ready for merge!"
        
    - name: Check for common code issues
      run: |
        echo "🔍 Checking for common issues..."
        # Check for console.log in TypeScript files (except test files)
        if grep -r "console\.log" --include="*.ts" --include="*.tsx" --exclude-dir=node_modules --exclude-dir=test --exclude-dir=tests src/Angular; then
          echo "⚠️ Warning: console.log statements found in production code"
        fi
        
        # Check for TODO comments that should be addressed
        if grep -r "TODO" --include="*.cs" --include="*.ts" --exclude-dir=node_modules src/; then
          echo "ℹ️ Info: TODO comments found - consider addressing them"
        fi
        
    # Phase 3: SAST Integration (placeholder) 
    - name: Static Application Security Testing
      run: |
        echo "🔒 Running static application security testing..."
        # TODO: Integrate with SAST tools like:
        # - SonarCloud security scanning
        # - Snyk vulnerability scanning  
        # - OWASP dependency check
        # Note: CodeQL already exists in separate workflow
        echo "✅ SAST placeholder complete - expand when security scanning is needed"

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: [download-feature-artifacts, build-fallback, code-quality]
    if: always() && (needs.download-feature-artifacts.outputs.artifacts-found == 'true' || needs.build-fallback.result == 'success')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download feature artifacts
      uses: actions/download-artifact@v4
      with:
        name: feature-build-${{ github.sha }}
      continue-on-error: true

    - name: Download fallback artifacts
      if: needs.build-fallback.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: pr-build-${{ github.sha }}
      continue-on-error: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: 'src/**/*.csproj'

    - name: Run Backend Unit Tests (using artifacts)
      run: |
        echo "🧪 Running backend unit tests using pre-built artifacts..."
        dotnet test test/Tests.Unit.Backend/Tests.Unit.Backend.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal"
      
    - name: Upload backend unit test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-unit-tests-${{ github.sha }}
        path: test/TestResults/
        
    - name: Publish backend unit test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Backend Unit Tests Summary
        path: test/TestResults/*.trx
        reporter: dotnet-trx

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [code-quality]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'src/Angular/package-lock.json'
      
    - name: Install Angular dependencies
      working-directory: ./src/Angular
      run: npm ci
      
    - name: Run Angular Unit Tests with Coverage
      working-directory: ./src/Angular
      run: npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage --reporters=junit,coverage
      
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-unit-tests-${{ github.sha }}
        path: src/Angular/coverage/
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-test-results-${{ github.sha }}
        path: src/Angular/test-results/
        
    - name: Publish frontend unit test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Frontend Unit Tests Summary
        path: src/Angular/test-results/*.xml
        reporter: java-junit

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: [download-feature-artifacts, build-fallback, code-quality]
    if: always() && (needs.download-feature-artifacts.outputs.artifacts-found == 'true' || needs.build-fallback.result == 'success') && needs.code-quality.result == 'success'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: 'src/**/*.csproj'

    - name: Download feature artifacts
      uses: actions/download-artifact@v4
      with:
        name: feature-build-${{ github.sha }}
      continue-on-error: true

    - name: Download fallback artifacts
      if: needs.build-fallback.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: pr-build-${{ github.sha }}
      continue-on-error: true

    - name: Run Backend Integration Tests with SQLite (using artifacts)
      run: |
        echo "🧪 Running backend integration tests using pre-built artifacts..."
        dotnet test test/Tests.Integration.Backend/Tests.Integration.Backend.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=detailed"
      env:
        CI: true
        ASPNETCORE_ENVIRONMENT: Testing
      timeout-minutes: 15
      
    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-integration-tests-${{ github.sha }}
        path: test/TestResults/
        
    - name: Publish backend integration test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Backend Integration Tests Summary
        path: test/TestResults/*.trx
        reporter: dotnet-trx

  e2e-smoke-tests:
    name: E2E Smoke Tests (Dev PRs Only)
    runs-on: ubuntu-latest
    needs: [download-feature-artifacts, build-fallback, backend-unit-tests, frontend-unit-tests, backend-integration-tests]
    # Run E2E smoke tests only for PRs to dev branch (fast validation)
    if: github.event.pull_request.base.ref == 'dev' && (needs.download-feature-artifacts.outputs.artifacts-found == 'true' || needs.build-fallback.result == 'success')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: 'src/**/*.csproj'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'src/Angular/package-lock.json'

    - name: Download feature artifacts
      uses: actions/download-artifact@v4
      with:
        name: feature-build-${{ github.sha }}
      continue-on-error: true

    - name: Download fallback artifacts
      if: needs.build-fallback.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: pr-build-${{ github.sha }}
      continue-on-error: true

    - name: Verify artifacts for E2E tests
      run: |
        echo "📋 Using pre-built artifacts for E2E tests..."
        if [ -f "version.json" ]; then
          echo "Artifact version:"
          cat version.json | jq .
        fi
        echo "✅ E2E tests will use existing build artifacts (no rebuild)"

    - name: Install Angular dependencies
      working-directory: ./src/Angular
      run: npm ci

    - name: Build Angular for production
      working-directory: ./src/Angular
      run: npm run build
      
    - name: Install E2E test dependencies
      working-directory: ./test/Tests.E2E.NG
      run: npm ci
      
    - name: Install Playwright browsers
      working-directory: ./test/Tests.E2E.NG
      run: npx playwright install --with-deps chromium
      
    - name: Set execute permissions for API binary
      run: |
        chmod +x ./src/Api/bin/Release/net8.0/Api
        echo "✅ Execute permissions set for API binary"
        
    - name: Run E2E Smoke Tests Only
      working-directory: ./test/Tests.E2E.NG
      run: |
        echo "🚀 Running E2E smoke tests for dev PR validation..."
        echo "Tagged with @smoke - should complete in 2-5 minutes"
        npm run test:smoke
      env:
        CI: true
        ASPNETCORE_ENVIRONMENT: Testing
        DatabaseProvider: SQLite
        TEST_RESET_TOKEN: test-only-token
        # Unique database per test run to avoid locking
        TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_number }}
        
    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-smoke-tests-${{ github.sha }}
        path: |
          test/Tests.E2E.NG/playwright-report/
          test/Tests.E2E.NG/test-results/
          
    - name: Upload database files (for debugging)
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: database-files-${{ github.sha }}
        path: |
          CrudTest_*.db
          CrudTest_*.db-wal
          CrudTest_*.db-shm
          
    - name: Cleanup
      if: always()
      run: |
        echo "🧹 Cleaning up test databases..."
        # Remove test database files created during this run
        rm -f CrudTest_*.db CrudTest_*.db-wal CrudTest_*.db-shm 2>/dev/null || true
        echo "✅ Cleanup complete"

  e2e-full-tests:
    name: E2E Full Tests (Main PRs Only)
    runs-on: ubuntu-latest
    needs: [download-feature-artifacts, build-fallback, backend-unit-tests, frontend-unit-tests, backend-integration-tests]
    # Run full E2E tests only for PRs to main branch (comprehensive validation)
    if: github.event.pull_request.base.ref == 'main' && (needs.download-feature-artifacts.outputs.artifacts-found == 'true' || needs.build-fallback.result == 'success')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: 'src/**/*.csproj'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'src/Angular/package-lock.json'

    - name: Download feature artifacts
      uses: actions/download-artifact@v4
      with:
        name: feature-build-${{ github.sha }}
      continue-on-error: true

    - name: Download fallback artifacts
      if: needs.build-fallback.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: pr-build-${{ github.sha }}
      continue-on-error: true

    - name: Verify artifacts for E2E tests
      run: |
        echo "📋 Using pre-built artifacts for E2E tests..."
        if [ -f "version.json" ]; then
          echo "Artifact version:"
          cat version.json | jq .
        fi
        echo "✅ E2E tests will use existing build artifacts (no rebuild)"

    - name: Install Angular dependencies
      working-directory: ./src/Angular
      run: npm ci

    - name: Build Angular for production
      working-directory: ./src/Angular
      run: npm run build
      
    - name: Install E2E test dependencies
      working-directory: ./test/Tests.E2E.NG
      run: npm ci
      
    - name: Install Playwright browsers
      working-directory: ./test/Tests.E2E.NG
      run: npx playwright install --with-deps chromium
      
    - name: Set execute permissions for API binary
      run: |
        chmod +x ./src/Api/bin/Release/net8.0/Api
        echo "✅ Execute permissions set for API binary"
        
    - name: Run E2E Full Test Suite
      working-directory: ./test/Tests.E2E.NG
      run: |
        echo "🚀 Running full E2E test suite for main PR validation..."
        echo "Complete test suite - should complete in 10-15 minutes"
        npm run test
      env:
        CI: true
        ASPNETCORE_ENVIRONMENT: Testing
        DatabaseProvider: SQLite
        TEST_RESET_TOKEN: test-only-token
        # Unique database per test run to avoid locking
        TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_number }}
        
    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-full-tests-${{ github.sha }}
        path: |
          test/Tests.E2E.NG/playwright-report/
          test/Tests.E2E.NG/test-results/
          
    - name: Upload database files (for debugging)
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: database-files-${{ github.sha }}
        path: |
          CrudTest_*.db
          CrudTest_*.db-wal
          CrudTest_*.db-shm
          
    - name: Cleanup
      if: always()
      run: |
        echo "🧹 Cleaning up test databases..."
        # Remove test database files created during this run
        rm -f CrudTest_*.db CrudTest_*.db-wal CrudTest_*.db-shm 2>/dev/null || true
        echo "✅ Cleanup complete"

  pr-validation-summary:
    name: PR Validation Summary
    runs-on: ubuntu-latest
    needs: [download-feature-artifacts, build-fallback, backend-unit-tests, frontend-unit-tests, backend-integration-tests, e2e-smoke-tests, e2e-full-tests]
    if: always()
    
    steps:
    - name: PR Status Check
      run: |
        echo "## 🔍 Pull Request Validation Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### 🔄 Progressive Testing & Artifact Reuse" >> $GITHUB_STEP_SUMMARY
        echo "This PR validation reused build artifacts from the feature branch to avoid redundant compilation." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Show different messaging based on target branch
        if [ "${{ github.event.pull_request.base.ref }}" == "dev" ]; then
          echo "**Target Branch:** \`dev\` (Development) - Smoke test validation" >> $GITHUB_STEP_SUMMARY
          echo "**E2E Testing:** Smoke tests only (2-5 minutes) for quick feedback" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ github.event.pull_request.base.ref }}" == "main" ]; then
          echo "**Target Branch:** \`main\` (Production) - Full validation" >> $GITHUB_STEP_SUMMARY
          echo "**E2E Testing:** Full test suite (10-15 minutes) for comprehensive validation" >> $GITHUB_STEP_SUMMARY
        else
          echo "**Target Branch:** \`${{ github.event.pull_request.base.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**E2E Testing:** No E2E tests required for this branch" >> $GITHUB_STEP_SUMMARY
        fi
        echo "**Build Strategy:** Reusing artifacts from feature branch build (no rebuild)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### Test Results" >> $GITHUB_STEP_SUMMARY
        echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
        
        # Build status (check both artifact download and fallback build)
        BUILD_STATUS="❌ Failed"
        if [ "${{ needs.download-feature-artifacts.outputs.artifacts-found }}" == "true" ]; then
          BUILD_STATUS="✅ Success (using feature artifacts)"
        elif [ "${{ needs.build-fallback.result }}" == "success" ]; then
          BUILD_STATUS="✅ Success (fallback build)"
        fi

        echo "| Build | $BUILD_STATUS |" >> $GITHUB_STEP_SUMMARY
        echo "| Backend Unit Tests | ${{ needs.backend-unit-tests.result == 'success' && '✅ Passed' || (needs.backend-unit-tests.result == 'failure' && '❌ Failed') || (needs.backend-unit-tests.result == 'cancelled' && '⏹️ Cancelled') || '⏸️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Frontend Unit Tests | ${{ needs.frontend-unit-tests.result == 'success' && '✅ Passed' || (needs.frontend-unit-tests.result == 'failure' && '❌ Failed') || (needs.frontend-unit-tests.result == 'cancelled' && '⏹️ Cancelled') || '⏸️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Backend Integration Tests | ${{ needs.backend-integration-tests.result == 'success' && '✅ Passed' || (needs.backend-integration-tests.result == 'failure' && '❌ Failed') || (needs.backend-integration-tests.result == 'cancelled' && '⏹️ Cancelled') || '⏸️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
        
        # E2E tests status - different handling based on target branch
        if [ "${{ github.event.pull_request.base.ref }}" == "dev" ]; then
          echo "| E2E Smoke Tests | ${{ needs.e2e-smoke-tests.result == 'success' && '✅ Passed' || (needs.e2e-smoke-tests.result == 'failure' && '❌ Failed') || (needs.e2e-smoke-tests.result == 'cancelled' && '⏹️ Cancelled') || '⏸️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ github.event.pull_request.base.ref }}" == "main" ]; then
          echo "| E2E Full Tests | ${{ needs.e2e-full-tests.result == 'success' && '✅ Passed' || (needs.e2e-full-tests.result == 'failure' && '❌ Failed') || (needs.e2e-full-tests.result == 'cancelled' && '⏹️ Cancelled') || '⏸️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| E2E Tests | ⏭️ Skipped (not required for this branch) |" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check overall status - different logic based on target branch
        if [ "${{ github.event.pull_request.base.ref }}" == "dev" ]; then
          # For dev PRs, require smoke tests
          BUILD_SUCCESS="false"
          if [ "${{ needs.download-feature-artifacts.outputs.artifacts-found }}" == "true" ] || [ "${{ needs.build-fallback.result }}" == "success" ]; then
            BUILD_SUCCESS="true"
          fi

          if [ "$BUILD_SUCCESS" == "true" ] && \
             [ "${{ needs.backend-unit-tests.result }}" == "success" ] && \
             [ "${{ needs.frontend-unit-tests.result }}" == "success" ] && \
             [ "${{ needs.backend-integration-tests.result }}" == "success" ] && \
             [ "${{ needs.e2e-smoke-tests.result }}" == "success" ]; then
            echo "### ✅ All validation checks passed for dev branch!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Smoke Testing:** E2E smoke tests completed for quick validation" >> $GITHUB_STEP_SUMMARY
            echo "**Quality Gate:** Basic functionality verified before merge to dev" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some validation checks failed" >> $GITHUB_STEP_SUMMARY
            echo "Please review the test results above for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
        elif [ "${{ github.event.pull_request.base.ref }}" == "main" ]; then
          # For main PRs, require full E2E tests
          BUILD_SUCCESS="false"
          if [ "${{ needs.download-feature-artifacts.outputs.artifacts-found }}" == "true" ] || [ "${{ needs.build-fallback.result }}" == "success" ]; then
            BUILD_SUCCESS="true"
          fi

          if [ "$BUILD_SUCCESS" == "true" ] && \
             [ "${{ needs.backend-unit-tests.result }}" == "success" ] && \
             [ "${{ needs.frontend-unit-tests.result }}" == "success" ] && \
             [ "${{ needs.backend-integration-tests.result }}" == "success" ] && \
             [ "${{ needs.e2e-full-tests.result }}" == "success" ]; then
            echo "### ✅ All validation checks passed for main branch!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Full Testing:** Complete E2E test suite completed for production readiness" >> $GITHUB_STEP_SUMMARY
            echo "**Quality Gate:** Comprehensive validation before production deployment" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some validation checks failed" >> $GITHUB_STEP_SUMMARY
            echo "Please review the test results above for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
        else
          # For other branches (like staging), no E2E tests required
          BUILD_SUCCESS="false"
          if [ "${{ needs.download-feature-artifacts.outputs.artifacts-found }}" == "true" ] || [ "${{ needs.build-fallback.result }}" == "success" ]; then
            BUILD_SUCCESS="true"
          fi

          if [ "$BUILD_SUCCESS" == "true" ] && \
             [ "${{ needs.backend-unit-tests.result }}" == "success" ] && \
             [ "${{ needs.frontend-unit-tests.result }}" == "success" ] && \
             [ "${{ needs.backend-integration-tests.result }}" == "success" ]; then
            echo "### ✅ All validation checks passed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Standard Testing:** Unit and integration tests completed" >> $GITHUB_STEP_SUMMARY
            echo "**E2E Testing:** Not required for this branch" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some validation checks failed" >> $GITHUB_STEP_SUMMARY
            echo "Please review the test results above for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
        fi