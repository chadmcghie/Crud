        echo "✅ Dev deployment healthy"

    - name: Run post-deployment tests
      run: |
        echo "🧪 Running post-deployment smoke tests..."
        # Add API endpoint tests, critical user flow tests, etc.
        echo "✅ Post-deployment tests passed"

  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: always()

    steps:
    - name: Create deployment summary
      run: |
        echo "## 🚀 Dev Environment Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ needs.deploy-dev.result == 'success' && '✅ Success' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: Dev" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Workflow run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "${{ needs.deploy-dev.result }}" == "success" ]; then
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Test the dev environment" >> $GITHUB_STEP_SUMMARY
          echo "2. Get stakeholder approval" >> $GITHUB_STEP_SUMMARY
          echo "3. Create PR from \`dev\` → \`main\` for production deployment" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ⚠️ Action Required" >> $GITHUB_STEP_SUMMARY
          echo "The dev deployment failed. Please check the logs and fix any issues." >> $GITHUB_STEP_SUMMARY
        fi

