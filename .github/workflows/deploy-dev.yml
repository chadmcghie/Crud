name: Deploy to Dev

on:
  push:
    branches: [ dev ]
  workflow_dispatch:  # Allow manual trigger

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  # Skip deployment if it's a Copilot commit
  check-commit:
    name: Check Deployment Prerequisites
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}

    steps:
    - name: Check if Copilot commit
      id: check
      run: |
        if [[ "${{ github.event.head_commit.author.email }}" == *"copilot"* ]] ||
           [[ "${{ github.event.head_commit.author.name }}" == *"copilot"* ]]; then
          echo "should-deploy=false" >> $GITHUB_OUTPUT
          echo "⏭️ Skipping deployment - Copilot commit detected"
        else
          echo "should-deploy=true" >> $GITHUB_OUTPUT
          echo "✅ Proceeding with dev deployment"
        fi

  build-dev:
    name: Build for Dev Environment (Once)
    runs-on: ubuntu-latest
    needs: check-commit
    if: needs.check-commit.outputs.should-deploy == 'true'
    outputs:
      artifacts-created: ${{ steps.create-artifacts.outputs.created }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: 'src/**/*.csproj'

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'src/Angular/package-lock.json'

    - name: Build backend for dev (Testing config)
      run: |
        echo "🏗️ Building backend for dev environment with Testing configuration..."
        dotnet restore solutions/Crud.sln
        dotnet build solutions/Crud.sln --no-restore --configuration Release
        echo "✅ Backend build completed for dev environment"

    - name: Install Angular dependencies
      working-directory: ./src/Angular
      run: |
        echo "📦 Installing Angular dependencies for dev build..."
        npm ci
        echo "✅ Angular dependencies installed"

    - name: Build Angular for dev
      working-directory: ./src/Angular
      run: |
        echo "🏗️ Building Angular for dev configuration..."
        npm run build -- --configuration=staging
        echo "✅ Angular built for dev configuration"

    - name: Create dev artifacts
      id: create-artifacts
      run: |
        echo "📦 Creating dev build artifacts..."

        # Create version info for dev environment
        echo "{\"version\":\"${{ github.sha }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"branch\":\"${{ github.ref_name }}\",\"buildNumber\":\"${{ github.run_number }}\",\"environment\":\"dev\"}" > version.json
        echo "📋 Version info for dev environment:"
        cat version.json

        echo "created=true" >> $GITHUB_OUTPUT
        echo "✅ Dev artifacts prepared"

    - name: Upload dev build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dev-build-${{ github.sha }}
        path: |
          src/*/bin/Release/
          test/*/bin/Release/
          src/Api/appsettings*.json
          src/Angular/dist/
          version.json
        retention-days: 7

  dev-e2e-tests:
    name: Dev Environment E2E Tests (Using Build Artifacts)
    runs-on: ubuntu-latest
    needs: [check-commit, build-dev]
    if: needs.check-commit.outputs.should-deploy == 'true' && needs.build-dev.outputs.artifacts-created == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download dev build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dev-build-${{ github.sha }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: 'src/**/*.csproj'

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'src/Angular/package-lock.json'

    - name: Verify dev artifacts
      run: |
        echo "📋 Using dev build artifacts (no rebuild)..."
        if [ -f "version.json" ]; then
          echo "Dev artifact version:"
          cat version.json | jq .
        fi
        echo "✅ Dev artifacts verified - ready for comprehensive E2E tests"

    # Install Angular dependencies (required for webServer)
    - name: Install Angular dependencies
      working-directory: ./src/Angular
      run: |
        echo "📦 Installing Angular dependencies for E2E test server..."
        npm ci
        echo "✅ Angular dependencies installed"

    # Install E2E dependencies
    - name: Install E2E dependencies
      working-directory: ./test/Tests.E2E.NG
      run: |
        echo "📦 Installing E2E test dependencies..."
        npm ci
        echo "✅ E2E dependencies installed"

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('test/Tests.E2E.NG/package-lock.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright browsers
      working-directory: ./test/Tests.E2E.NG
      run: |
        echo "🎭 Installing Playwright browsers..."
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]; then
          echo "✅ Playwright browsers restored from cache"
        else
          echo "📥 Downloading Playwright browsers (no cache hit)..."
          npx playwright install chromium
          echo "✅ Playwright browsers installed"
        fi

    # Run FULL E2E test suite - comprehensive validation for dev environment
    - name: Run full E2E test suite in dev environment
      working-directory: ./test/Tests.E2E.NG
      run: |
        echo "🚀 Running FULL E2E test suite in dev environment..."
        echo "Comprehensive validation - ALL tests, targeting 15-20 minutes with Testing configuration"
        npm run test  # Run ALL E2E tests (no filter)
      env:
        CI: true
        ASPNETCORE_ENVIRONMENT: Testing
        DatabaseProvider: SQLite
        TEST_RESET_TOKEN: test-only-token
        TEST_RUN_ID: dev-${{ github.run_id }}-${{ github.run_number }}

    - name: Upload dev test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dev-e2e-test-results-${{ github.sha }}
        path: |
          test/Tests.E2E.NG/playwright-report/
          test/Tests.E2E.NG/test-results/
        retention-days: 7

  prepare-dev-artifacts:
    name: Prepare Dev Deployment Artifacts (Using Build Artifacts)
    runs-on: ubuntu-latest
    needs: [build-dev, dev-e2e-tests]
    if: needs.dev-e2e-tests.result == 'success' && needs.build-dev.outputs.artifacts-created == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download dev build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dev-build-${{ github.sha }}

    - name: Verify dev artifacts for deployment
      run: |
        echo "📦 Using dev build artifacts for deployment (no rebuild)..."
        if [ -f "version.json" ]; then
          echo "📋 Deployment artifact version:"
          cat version.json | jq .
        fi
        echo "✅ Dev artifacts verified for deployment preparation"

    - name: Verify Angular dev build
      run: |
        echo "📋 Verifying Angular dev build from artifacts..."
        if [ -d "src/Angular/dist" ]; then
          echo "✅ Angular dev build found in artifacts"
          ls -la src/Angular/dist/
        else
          echo "❌ Angular dev build not found in artifacts!"
          exit 1
        fi

    - name: Package backend for dev (using artifacts)
      run: |
        echo "📦 Packaging backend from dev artifacts (no rebuild)..."

        # Package the pre-built backend from artifacts
        mkdir -p ./dev-backend
        cp -r src/Api/bin/Release/net8.0/* ./dev-backend/

        # Copy appsettings files
        if [ -f "src/Api/appsettings.json" ]; then
          cp src/Api/appsettings*.json ./dev-backend/
          echo "✅ Appsettings files copied to dev package"
        fi

        # Create version info for dev environment
        echo "{\"version\":\"${{ github.sha }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"branch\":\"${{ github.ref_name }}\",\"buildNumber\":\"${{ github.run_number }}\",\"environment\":\"dev\"}" > ./dev-backend/version.json
        echo "📋 Version info for dev environment:"
        cat ./dev-backend/version.json

        cd ./dev-backend
        zip -r ../dev-api.zip .
        cd ..
        echo "✅ Backend packaged for dev deployment"

    - name: Package frontend (using artifacts)
      run: |
        echo "📦 Packaging frontend from dev artifacts (no rebuild)..."
        cd ./src/Angular/dist
        zip -r ../../../dev-frontend.zip .
        cd ../../..
        echo "✅ Frontend packaged from dev artifacts"

    - name: Upload dev artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dev-artifacts-${{ github.sha }}
        path: |
          dev-api.zip
          dev-frontend.zip
        retention-days: 7

  deploy-dev:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    needs: prepare-dev-artifacts
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.url }}

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dev-artifacts-${{ github.sha }}

    # ====================================
    # Dev Environment Deployment
    # ====================================
    # Configure deployment based on your hosting platform
    # Uncomment and modify the appropriate section below:

    # --- Option 1: Azure App Service ---
    # - name: Deploy to Azure Web App
