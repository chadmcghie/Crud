name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  # Skip deployment if it's a Copilot commit
  check-commit:
    name: Check Deployment Prerequisites
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}

    steps:
    - name: Check if Copilot commit
      id: check
      run: |
        if [[ "${{ github.event.head_commit.author.email }}" == *"copilot"* ]] ||
           [[ "${{ github.event.head_commit.author.name }}" == *"copilot"* ]]; then
          echo "should-deploy=false" >> $GITHUB_OUTPUT
          echo "⏭️ Skipping deployment - Copilot commit detected"
        else
          echo "should-deploy=true" >> $GITHUB_OUTPUT
          echo "✅ Proceeding with production deployment"
        fi

  build-production:
    name: Build for Production (Once)
    runs-on: ubuntu-latest
    needs: check-commit
    if: needs.check-commit.outputs.should-deploy == 'true'
    outputs:
      artifacts-created: ${{ steps.create-artifacts.outputs.created }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: 'src/**/*.csproj'

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'src/Angular/package-lock.json'

    - name: Build backend for production (Release config)
      run: |
        echo "🏗️ Building backend for production with Release configuration..."
        dotnet restore solutions/Crud.sln
        dotnet build solutions/Crud.sln --no-restore --configuration Release
        echo "✅ Backend build completed for production"

    - name: Install Angular dependencies
      working-directory: ./src/Angular
      run: |
        echo "📦 Installing Angular dependencies for production build..."
        npm ci
        echo "✅ Angular dependencies installed"

    - name: Build Angular for production
      working-directory: ./src/Angular
      run: |
        echo "🏗️ Building Angular for production configuration..."
        npm run build -- --configuration=production
        echo "✅ Angular built for production with optimization"

    - name: Create production artifacts
      id: create-artifacts
      run: |
        echo "📦 Creating production build artifacts..."

        # Create version info for production environment
        echo "{\"version\":\"${{ github.sha }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"branch\":\"${{ github.ref_name }}\",\"buildNumber\":\"${{ github.run_number }}\",\"environment\":\"production\"}" > version.json
        echo "📋 Version info for production:"
        cat version.json

        echo "created=true" >> $GITHUB_OUTPUT
        echo "✅ Production artifacts prepared"

    - name: Upload production build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: production-build-${{ github.sha }}
        path: |
          src/*/bin/Release/
          test/*/bin/Release/
          src/Api/appsettings*.json
          src/Angular/dist/
          version.json
        retention-days: 30  # Longer retention for production

  production-smoke-tests:
    name: Production Smoke Tests (Using Build Artifacts)
    runs-on: ubuntu-latest
    needs: [check-commit, build-production]
    if: needs.check-commit.outputs.should-deploy == 'true' && needs.build-production.outputs.artifacts-created == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download production build artifacts
      uses: actions/download-artifact@v4
      with:
        name: production-build-${{ github.sha }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: 'src/**/*.csproj'

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'src/Angular/package-lock.json'

    - name: Verify production artifacts
      run: |
        echo "📋 Using production build artifacts (no rebuild)..."
        if [ -f "version.json" ]; then
          echo "Production artifact version:"
          cat version.json | jq .
        fi
        echo "✅ Production artifacts verified - ready for smoke tests"

    # Install Angular dependencies (required for webServer)
    - name: Install Angular dependencies
      working-directory: ./src/Angular
      run: |
        echo "📦 Installing Angular dependencies for E2E test server..."
        npm ci
        echo "✅ Angular dependencies installed"

    # Install E2E dependencies
    - name: Install E2E dependencies
      working-directory: ./test/Tests.E2E.NG
      run: |
        npm ci
        npx playwright install --with-deps chromium

    # Run smoke tests only - comprehensive testing already done in dev
    - name: Run production smoke tests
      working-directory: ./test/Tests.E2E.NG
      run: |
        echo "🚀 Running production smoke tests..."
        echo "Quick validation - targeting ~2-3 minutes (full suite already passed in dev)"
        npm run test:smoke  # Smoke tests only
      env:
        CI: true
        ASPNETCORE_ENVIRONMENT: Testing
        DatabaseProvider: SQLite
        TEST_RESET_TOKEN: test-only-token
        TEST_RUN_ID: production-${{ github.run_id }}-${{ github.run_number }}

    - name: Upload production test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: production-smoke-test-results-${{ github.sha }}
        path: |
          test/Tests.E2E.NG/playwright-report/
          test/Tests.E2E.NG/test-results/
        retention-days: 30  # Longer retention for production

  prepare-production-artifacts:
    name: Prepare Production Deployment Artifacts (Using Build Artifacts)
    runs-on: ubuntu-latest
    needs: [build-production, production-smoke-tests]
    if: needs.production-smoke-tests.result == 'success' && needs.build-production.outputs.artifacts-created == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download production build artifacts
      uses: actions/download-artifact@v4
      with:
        name: production-build-${{ github.sha }}

    - name: Verify production artifacts for deployment
      run: |
        echo "📦 Using production build artifacts for deployment (no rebuild)..."
        if [ -f "version.json" ]; then
          echo "📋 Deployment artifact version:"
          cat version.json | jq .
        fi
        echo "✅ Production artifacts verified for deployment preparation"

    - name: Verify Angular production build
      run: |
        echo "📋 Verifying Angular production build from artifacts..."
        if [ -d "src/Angular/dist" ]; then
          echo "✅ Angular production build found in artifacts"
          ls -la src/Angular/dist/
        else
          echo "❌ Angular production build not found in artifacts!"
          exit 1
        fi

    - name: Package backend for production (using artifacts)
      run: |
        echo "📦 Packaging backend from production artifacts (no rebuild)..."

        # Package the pre-built backend from artifacts
        mkdir -p ./production-backend
        cp -r src/Api/bin/Release/net8.0/* ./production-backend/

        # Copy appsettings files
        if [ -f "src/Api/appsettings.json" ]; then
          cp src/Api/appsettings*.json ./production-backend/
          echo "✅ Appsettings files copied to production package"
        fi

        # Create version info for production environment
        echo "{\"version\":\"${{ github.sha }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"branch\":\"${{ github.ref_name }}\",\"buildNumber\":\"${{ github.run_number }}\",\"environment\":\"production\"}" > ./production-backend/version.json
        echo "📋 Version info for production:"
        cat ./production-backend/version.json

        cd ./production-backend
        zip -r ../production-api.zip .
        cd ..
        echo "✅ Backend packaged for production deployment"

    - name: Package frontend (using artifacts)
      run: |
        echo "📦 Packaging frontend from production artifacts (no rebuild)..."
        cd ./src/Angular/dist
        zip -r ../../../production-frontend.zip .
        cd ../../..
        echo "✅ Frontend packaged from production artifacts"

    - name: Upload production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: production-artifacts-${{ github.sha }}
        path: |
          production-api.zip
          production-frontend.zip
        retention-days: 30  # Longer retention for production

  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: prepare-production-artifacts
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: production-artifacts-${{ github.sha }}

    # ====================================
    # Production Deployment
    # ====================================
    # Configure deployment based on your hosting platform
