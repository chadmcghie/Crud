      id: deploy
      run: |
        echo "🚀 Deploying to production environment..."
        echo "Version: ${{ github.sha }}"
        # Replace this section with actual deployment commands
        # Example: Copy files to server, restart services, etc.
        echo "url=https://your-app.com" >> $GITHUB_OUTPUT

    - name: Verify deployment health
      run: |
        echo "🏥 Checking production deployment health..."
        # Uncomment and modify for your production URL:
        # curl -f ${{ steps.deploy.outputs.url }}/health || exit 1
        echo "✅ Production deployment healthy"

    - name: Run post-deployment tests
      run: |
        echo "🧪 Running post-deployment smoke tests..."
        # Add API endpoint tests, critical user flow tests, etc.
        echo "✅ Post-deployment tests passed"

  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: deploy-production
    if: always()

    steps:
    - name: Create deployment summary
      run: |
        echo "## 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ needs.deploy-production.result == 'success' && '✅ Success' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Workflow run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "${{ needs.deploy-production.result }}" == "success" ]; then
          echo "### ✅ Production Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Monitor application metrics and error rates" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify critical user flows in production" >> $GITHUB_STEP_SUMMARY
          echo "3. Keep previous version available for quick rollback if needed" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ Production Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**⚠️ CRITICAL: Production deployment failed**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs and initiate rollback procedures if necessary." >> $GITHUB_STEP_SUMMARY
        fi

