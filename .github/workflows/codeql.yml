name: "Code Quality & Linting"

on:
  push:
    branches: 
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'copilot/**'
  workflow_dispatch:

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # For auto-formatting commits
  checks: write
  pull-requests: write

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  code-quality:
    name: Code Quality & Auto-Format
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        ref: ${{ github.ref_name }}
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: 'src/**/*.csproj'
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'src/Angular/package-lock.json'
        
    - name: Auto-format Backend Code
      run: |
        echo "í´§ Auto-formatting C# code with dotnet format..."
        dotnet format solutions/Crud.sln
        echo "âœ… Formatting complete"
        
    - name: Frontend Linting
      working-directory: ./src/Angular
      run: |
        echo "í´ Running Angular linting..."
        npm ci
        npm run lint
        
    - name: Commit and Push Formatting Changes
      run: |
        echo "í´ Checking for formatting changes..."
        
        # Configure git
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Add all changes including line ending normalization
        git add -A --renormalize
        
        # Check if there are any staged changes
        if ! git diff --staged --quiet; then
          echo "âœ¨ Formatting changes detected, committing..."
          git commit -m "style: auto-format code with dotnet format [skip ci]
        
        Applied automatic formatting to ensure consistent code style.
        This commit was automatically generated by GitHub Actions."
          
          # Push changes
          git push origin HEAD:${{ github.ref_name }}
          echo "âœ… Formatting changes pushed successfully"
          
          # IMPORTANT: Pull the changes back to update our local working copy
          echo "í³¥ Pulling formatting changes back to working copy..."
          git pull origin ${{ github.ref_name }}
        else
          echo "âœ… No formatting changes needed - code is already properly formatted"
        fi
        
    - name: Verify Final Formatting
      run: |
        echo "í´ Verifying that all code is now properly formatted..."
        dotnet format solutions/Crud.sln --verify-no-changes --verbosity diagnostic
        if [ $? -ne 0 ]; then
          echo "âŒ ERROR: Code still has formatting issues after auto-format!"
          echo "This should not happen. Please check the workflow configuration."
          exit 1
        fi
        echo "âœ… All code is properly formatted and ready for merge!"
        
    - name: Check for common code issues
      run: |
        echo "í´ Checking for common issues..."
        # Check for console.log in TypeScript files (except test files)
        if grep -r "console\.log" --include="*.ts" --include="*.tsx" --exclude-dir=node_modules --exclude-dir=test --exclude-dir=tests src/Angular; then
          echo "âš ï¸ Warning: console.log statements found in production code"
        fi
        
        # Check for TODO comments that should be addressed
        if grep -r "TODO" --include="*.cs" --include="*.ts" --exclude-dir=node_modules src/; then
          echo "â„¹ï¸ Info: TODO comments found - consider addressing them"
        fi
        
    - name: Summary
      if: always()
      run: |
        echo "## í´ Code Quality & Linting Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Code Quality Checks**: All formatting and linting completed at feature level" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### What was completed:" >> $GITHUB_STEP_SUMMARY
        echo "- âœ… Backend auto-formatting with dotnet format" >> $GITHUB_STEP_SUMMARY
        echo "- âœ… Frontend linting with Angular ESLint" >> $GITHUB_STEP_SUMMARY
        echo "- âœ… Auto-commit of formatting changes" >> $GITHUB_STEP_SUMMARY
        echo "- âœ… Code quality issue detection" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next steps:" >> $GITHUB_STEP_SUMMARY
        echo "- Create PR to \`dev\`: Integration tests only (code quality already completed)" >> $GITHUB_STEP_SUMMARY
        echo "- After merge to \`dev\`: E2E tests run during staging deployment" >> $GITHUB_STEP_SUMMARY
