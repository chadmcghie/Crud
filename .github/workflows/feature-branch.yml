name: Feature Branch

on:
  push:
    branches: 
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'copilot/**'
  workflow_dispatch:

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # For auto-formatting commits
  actions: read    # For CodeQL actions
  security-events: write  # For CodeQL security analysis results

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  # ====================================
  # PHASE 1: CODE QUALITY & LINTING (CLEAN CODE FIRST)
  # ====================================
  code-quality:
    name: Code Quality & Auto-Format
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        ref: ${{ github.ref_name }}
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: 'src/**/*.csproj'
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'src/Angular/package-lock.json'
        
    - name: Auto-format Backend Code
      run: |
        echo "🎨 Auto-formatting C# code with dotnet format..."
        dotnet format solutions/Crud.sln
        echo "✅ Formatting complete"
        
    - name: Frontend Linting
      working-directory: ./src/Angular
      run: |
        echo "🔍 Running Angular linting..."
        npm ci
        npm run lint
        
    - name: Commit and Push Formatting Changes
      run: |
        echo "📝 Checking for formatting changes..."
        
        # Configure git
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Add all changes including line ending normalization
        git add -A --renormalize
        
        # Check if there are any staged changes
        if ! git diff --staged --quiet; then
          echo "✨ Formatting changes detected, committing..."
          git commit -m "style: auto-format code with dotnet format [skip ci]"
          
          # Push changes
          git push origin HEAD:${{ github.ref_name }}
          echo "✅ Formatting changes pushed successfully"
          
          # IMPORTANT: Pull the changes back to update our local working copy
          echo "🔄 Pulling formatting changes back to working copy..."
          git pull origin ${{ github.ref_name }}
        else
          echo "✅ No formatting changes needed - code is already properly formatted"
        fi
        
    - name: Verify Final Formatting
      run: |
        echo "🔍 Verifying that all code is now properly formatted..."
        dotnet format solutions/Crud.sln --verify-no-changes --verbosity diagnostic
        if [ $? -ne 0 ]; then
          echo "❌ ERROR: Code still has formatting issues after auto-format!"
          echo "This should not happen. Please check the workflow configuration."
          exit 1
        fi
        echo "✅ All code is properly formatted and ready for build!"
        
    - name: Check for common code issues
      run: |
        echo "🔍 Checking for common issues..."
        # Check for console.log in TypeScript files (except test files)
        if grep -r "console\.log" --include="*.ts" --include="*.tsx" --exclude-dir=node_modules --exclude-dir=test --exclude-dir=tests src/Angular; then
          echo "⚠️ Warning: console.log statements found in production code"
        fi
        
        # Check for TODO comments that should be addressed
        if grep -r "TODO" --include="*.cs" --include="*.ts" --exclude-dir=node_modules src/; then
          echo "ℹ️ Info: TODO comments found - consider addressing them"
        fi

  # ====================================
  # PHASE 2: BUILD & UNIT TESTS (CLEAN CODE BUILT)
  # ====================================
  build-and-unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
    - name: Checkout code (with formatting changes)
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        ref: ${{ github.ref_name }}
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: 'src/**/*.csproj'
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'src/Angular/package-lock.json'
        
    # Build the cleaned/formatted code - this is the ONLY build
    - name: Restore .NET dependencies
      run: dotnet restore solutions/Crud.sln
      
    - name: Build backend (clean code, single build)
      run: dotnet build solutions/Crud.sln --no-restore --configuration Release
      
    - name: Create versioned artifact for downstream reuse
      run: |
        echo "VERSION=${{ github.sha }}" >> $GITHUB_ENV
        echo "BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
        # Package with version info for artifact traceability
        echo "{\"version\":\"${{ github.sha }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"branch\":\"${{ github.ref_name }}\",\"buildNumber\":\"${{ github.run_number }}\",\"workflow\":\"feature-branch-complete\",\"includesFormatting\":\"true\"}" > version.json
        
    - name: Verify appsettings files exist
      run: |
        echo "📁 Verifying appsettings files before artifact upload:"
        ls -la src/Api/appsettings*.json
        echo "✅ All appsettings files found"
      
    - name: Upload build artifacts for reuse in PRs
      uses: actions/upload-artifact@v4
      with:
        name: feature-build-${{ github.sha }}
        path: |
          src/*/bin/Release/
          test/*/bin/Release/
          src/Api/appsettings*.json
          version.json
        retention-days: 7  # Shorter retention for feature artifacts
      
    - name: Run backend unit tests
      run: |
        echo "🧪 Running backend unit tests on clean, formatted code..."
        dotnet test test/Tests.Unit.Backend/Tests.Unit.Backend.csproj --no-build --configuration Release
      
    # Frontend unit tests
    - name: Install Angular dependencies
      working-directory: ./src/Angular
      run: npm ci
      
    - name: Run Angular unit tests
      working-directory: ./src/Angular
      run: npm run test -- --watch=false --browsers=ChromeHeadless

  # ====================================
  # PHASE 3: SECURITY ANALYSIS (CodeQL on clean, built code)
  # ====================================
  security-analysis:
    name: Security Analysis (CodeQL)
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Download build artifacts from build-and-unit-tests
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: feature-build-${{ github.sha }}

    - name: Verify artifacts for CodeQL
      run: |
        if [ -f "version.json" ]; then
          echo "✅ Using pre-built artifacts for CodeQL analysis (includes formatting changes)"
          cat version.json | jq .
        else
          echo "❌ No build artifacts found - CodeQL needs a build"
          exit 1
        fi

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    # Only setup tools, don't build (artifacts already exist from clean build)
    - name: Setup .NET (for CodeQL tools only)
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node.js (for CodeQL tools only)
      if: matrix.language == 'javascript'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Skip build steps - use pre-built artifacts from clean, formatted code
    # The build artifacts from build-and-unit-tests are already available

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  # ====================================
  # PHASE 4: SUMMARY & NOTIFICATION
  # ====================================
  feature-branch-summary:
    name: Feature Branch Analysis Summary
    runs-on: ubuntu-latest
    needs: [code-quality, build-and-unit-tests, security-analysis]
    if: always()
    
    steps:
    - name: Create comprehensive summary
      run: |
        echo "## 🚀 Feature Branch Complete Analysis Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Smart Build Strategy**: Code quality first, then single build with clean code" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### Analysis Results" >> $GITHUB_STEP_SUMMARY
        echo "| Phase | Status | Details |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|---------|" >> $GITHUB_STEP_SUMMARY
        
        # Code quality status
        QUALITY_STATUS="${{ needs.code-quality.result == 'success' && '✅ Success' || (needs.code-quality.result == 'failure' && '❌ Failed') || (needs.code-quality.result == 'cancelled' && '⏹️ Cancelled') || '⏸️ Skipped' }}"
        echo "| Code Quality & Linting | $QUALITY_STATUS | Auto-formatting and linting |" >> $GITHUB_STEP_SUMMARY
        
        # Build and validation status
        BUILD_STATUS="${{ needs.build-and-unit-tests.result == 'success' && '✅ Success' || (needs.build-and-unit-tests.result == 'failure' && '❌ Failed') || (needs.build-and-unit-tests.result == 'cancelled' && '⏹️ Cancelled') || '⏸️ Skipped' }}"
        echo "| Build & Unit Tests | $BUILD_STATUS | Single build with clean, formatted code |" >> $GITHUB_STEP_SUMMARY
        
        # Security analysis status
        SECURITY_STATUS="${{ needs.security-analysis.result == 'success' && '✅ Success' || (needs.security-analysis.result == 'failure' && '❌ Failed') || (needs.security-analysis.result == 'cancelled' && '⏹️ Cancelled') || '⏸️ Skipped' }}"
        echo "| Security Analysis (CodeQL) | $SECURITY_STATUS | C# and JavaScript analysis |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### Smart Build Strategy Benefits" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ **Code Quality First**: Formatting changes are part of the build" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ **Single Build**: Only one compilation with clean, formatted code" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ **Clean Analysis**: Security analysis runs on properly formatted code" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ **No Conditional Rebuilds**: Linear workflow, no complex dependencies" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ **Artifact Efficiency**: Build artifacts include all formatting changes" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Overall status check
        if [ "${{ needs.code-quality.result }}" == "success" ] && \
           [ "${{ needs.build-and-unit-tests.result }}" == "success" ] && \
           [ "${{ needs.security-analysis.result }}" == "success" ]; then
          echo "### ✅ All Analysis Complete - Ready for PR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Create PR to \`dev\`: Integration tests only (unit tests already completed)" >> $GITHUB_STEP_SUMMARY
          echo "2. After merge to \`dev\`: E2E tests run during staging deployment" >> $GITHUB_STEP_SUMMARY
          echo "3. PR to \`main\`: Integration tests + production safety checks" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ Some Analysis Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please review the failed phases above and fix any issues before creating a PR." >> $GITHUB_STEP_SUMMARY
          
          # Exit with error to fail the workflow
          if [ "${{ needs.code-quality.result }}" != "success" ] || \
             [ "${{ needs.build-and-unit-tests.result }}" != "success" ] || \
             [ "${{ needs.security-analysis.result }}" != "success" ]; then
            exit 1
          fi
        fi